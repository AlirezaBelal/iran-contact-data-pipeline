name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q src tests benchmarks

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test installed CLI
        run: |
          contact-cleaner examples/contacts.example.csv /tmp/cleaned_contacts.csv
          python - <<'PY'
          import pandas as pd

          output = pd.read_csv("/tmp/cleaned_contacts.csv", dtype=str)
          assert len(output) == 5, f"Expected 5 output rows, got {len(output)}"
          assert list(output.columns) == [
              "first_name",
              "last_name",
              "selected_phone",
              "mobile_operator",
          ]
          assert output["selected_phone"].str.fullmatch(r"09\d{9}").all()
          PY

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage ruff

      - name: Run Ruff correctness checks
        run: ruff check --select E9,F63,F7,F82 src tests benchmarks

      - name: Enforce test coverage
        run: |
          coverage run --source=src -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=80

      - name: Run reproducible benchmark smoke
        run: python benchmarks/benchmark_pipeline.py --rows 1000

  security-audit:
    name: Dependency and data-safety audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject unexpected tracked datasets
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git ls-files '*.csv' '*.tsv' '*.xlsx' '*.xls' '*.parquet' '*.feather' '*.jsonl' '*.vcf' |
              grep -v '^examples/contacts\.example\.csv$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected tracked data files detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, quality, security-audit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
