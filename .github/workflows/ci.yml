name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test installed CLI
        run: |
          contact-cleaner examples/contacts.example.csv /tmp/cleaned_contacts.csv
          python - <<'PY'
          import pandas as pd

          output = pd.read_csv("/tmp/cleaned_contacts.csv", dtype=str)
          assert len(output) == 5, f"Expected 5 output rows, got {len(output)}"
          assert list(output.columns) == [
              "first_name",
              "last_name",
              "selected_phone",
              "mobile_operator",
          ]
          assert output["selected_phone"].str.fullmatch(r"09\d{9}").all()
          PY

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
