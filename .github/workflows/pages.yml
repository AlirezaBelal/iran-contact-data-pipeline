name: GitHub Pages

on:
  push:
    branches: [master]
    paths: ['docs/**', 'tests/browser_demo.test.cjs', 'tests/test_browser_parity.py', '.github/workflows/pages.yml']
  pull_request:
    branches: [master]
    paths: ['docs/**', 'tests/browser_demo.test.cjs', 'tests/test_browser_parity.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node --test tests/browser_demo.test.cjs
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_browser_parity.py' -v
      - name: Check static assets and network boundary
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/style.css
          grep -q "connect-src 'none'" docs/index.html
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1200000

