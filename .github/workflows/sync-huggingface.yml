name: Sync Hugging Face Space

# No push trigger: source review and CI must not publish a public service.
on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: "Publish the synthetic-only demo after reviewing Space hardware and existing caches"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && inputs.confirm_publication == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assemble demo with the authoritative core
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          target = Path(os.environ["RUNNER_TEMP"]) / "space-source"
          shutil.copytree("hf-space", target)
          shutil.copytree("src", target / "src", ignore=shutil.ignore_patterns("__pycache__", "*.pyc"))
          for name in ("setup.py", "pyproject.toml", "LICENSE"):
              shutil.copy2(name, target / name)
          PY

      - name: Install Hugging Face CLI
        run: |
          python -m pip install 'huggingface_hub>=1,<3'

      - name: Publish explicitly approved synthetic Space
        env:
          HF_OIDC_RESOURCE: spaces/AlirezaBelal/iran-contact-data-pipeline
        run: |
          hf upload AlirezaBelal/iran-contact-data-pipeline "$RUNNER_TEMP/space-source" . --repo-type space --commit-message "Approved source sync from GitHub ${GITHUB_SHA::7}"
